name: Java CI with Gradle, Selenide and MySQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'


      - name: Container start
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: "./docker-compose.yml"


      - name: Waiting for container start
        run: sleep 30


      - name: Start SUT
        run: |
          
          nohup java -jar artifacts/app-deadline.jar \
            -P:jdbc.url=jdbc:mysql://localhost:3306/app \
            -P:jdbc.user=app \
            -P:jdbc.password=pass > sut.log 2>&1 &
          
          sleep 5


      - name: Grant execute permission for gradlew
        run: chmod +x gradlew


      - name: Run tests
        run: ./gradlew test --info -Dselenide.headless=true


      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/


      - name: Upload SUT Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sut-logs
          path: sut.log